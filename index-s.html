<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日研經釋義講章大綱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        
        /* 基礎設定 */
        html { scroll-behavior: smooth; }
        body { background-color: #050505; color: #fff; font-family: 'Noto Sans TC', sans-serif; margin: 0; padding-top: 80px; }

        /* 置頂工具列：毛玻璃特效 */
        #top-toolbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            z-index: 1000; background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; transition: all 0.3s ease;
        }

        .fixed-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background-image: linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.85) 100%), 
                              url('archive/image/old-testament/1d8d4f0c-8d94-4069-8158-5cd573786344.jpg');
            background-size: cover; background-position: center;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .glass-card:hover { transform: translateY(-8px); border-color: rgba(249, 210, 27, 0.5); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

        /* 導航按鈕 */
        .nav-link { font-weight: 800; color: #aaa; transition: 0.3s; cursor: pointer; font-size: 14px; letter-spacing: 1px; }
        .nav-link:hover { color: #f9d21b; }
        
        .back-home-btn {
			background: rgba(249, 210, 27, 0.1);     border: 1px solid #f9d21b;     color: #f9d21b;    /* 修改這裡：調整內距讓它變成正方形或圓形 */
			padding: 8px; 	  border-radius: 12px; /* 從 50px 改為 12px，更有科技感 */
			display: flex;    align-items: center;    justify-content: center;    transition: 0.3s;
		}
        .back-home-btn:hover { background: #f9d21b; color: #000; box-shadow: 0 0 15px rgba(249, 210, 27, 0.4); }

        /* 書卷按鈕 */
        .book-btn {
            aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.2rem; cursor: pointer; border: 1px solid rgba(249, 210, 27, 0.2);
            color: #f9d21b; transition: 0.3s; background: rgba(249, 210, 27, 0.05);
        }
        .book-btn:hover { background: #f9d21b; color: #000; transform: scale(1.1); }
        .book-btn.disabled { opacity: 0.1; cursor: not-allowed; filter: grayscale(1); }

        /* 下載按鈕 */
        .btn-download { font-size: 12px; font-weight: 800; padding: 6px 16px; border-radius: 8px; transition: 0.2s; border: 1px solid rgba(255, 255, 255, 0.15); }
        .btn-download:hover { transform: scale(1.05); filter: brightness(1.2); }

        /* 分頁按鈕 */
        .page-btn { padding: 5px 12px; margin: 0 3px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; font-size: 12px; transition: 0.2s; color: #fff; }
		
		/* 下拉選單樣式優化 */
		.page-select {background: rgba(255, 255, 255, 0.05); color: #f9d21b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px;padding: 4px 8px;
			font-size: 14px; font-weight: 800; cursor: pointer; outline: none;	 appearance: none; /* 移除原生箭頭 */ -webkit-appearance: none; text-align: center;}

		.page-select:hover { border-color: #f9d21b; }
		/* 下拉選單內的選項背景（部分瀏覽器限制修改此處） */
		.page-select option { background: #1a1a1a; color: #fff; }

		/* 箭頭按鈕微調 */
		.nav-arrow-btn { padding: 5px 10px; color: #f9d21b; font-size: 12px; transition: 0.2s; opacity: 0.8;}
		.nav-arrow-btn:hover:not(:disabled) { opacity: 1; transform: scale(1.2); }
		.nav-arrow-btn:disabled { color: #555; cursor: not-allowed; }
	    .page-btn.active { background: #f9d21b; color: #000; font-weight: bold; border-color: #f9d21b; }

        /* 浮動回到頂部按鈕 */
        #scroll-to-top {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            background: #f9d21b; color: #000; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 999; opacity: 0; visibility: hidden; transition: 0.4s;
        }
        #scroll-to-top.show { opacity: 1; visibility: visible; }
        #scroll-to-top:hover { transform: scale(1.1); background: #fff; }

        .gold-gradient-text { background: linear-gradient(to right, #fff9c4, #f9d21b, #f57f17); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div class="fixed-background"></div>

    <nav id="top-toolbar">
        <div class="max-w-7xl mx-auto w-full px-6 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <span id="toolbar-title" class="gold-gradient-text font-black text-2xl tracking-tighter cursor-pointer" onclick="showMap()">BIBLE MAP</span>
            </div>
            
            <div id="home-nav" class="flex gap-8 items-center">
                <a href="#ot-section" class="nav-link">舊約聖經</a>
                <a href="#nt-section" class="nav-link">新約聖經</a>
            </div>

            <div id="gallery-nav" class="hidden w-full flex justify-between items-center ml-10">
                <button class="back-home-btn" onclick="showMap()"title="回到首頁">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
					<polyline points="9 22 9 12 15 12 15 22"></polyline>
					</svg>
				</button>
                <div id="toolbar-pagination" class="flex items-center"></div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6">
        <header class="text-center mt-12 mb-16">
            <h1 id="page-title" class="text-5xl md:text-8xl font-black tracking-tighter gold-gradient-text mb-4 uppercase">每日研經釋義</h1>
            <p id="sub-title" class="text-gray-400 tracking-[0.4em] text-4xl font-light uppercase">講章大綱</p>
			<p></p>
			
			<div id="search-container" class="mt-8 max-w-md mx-auto relative group">
			// <input type="text" id="search-input" placeholder="搜尋：出 1~3 或 2026/5..." 
					// class="w-full bg-white/5 border border-white/30 rounded-full px-6 py-3 text-white text-center focus:outline-none focus:border-yellow-500/50 transition-all placeholder:text-gray-600">
			<input type="text" id="search-input" placeholder="搜尋：出 1~3 或 2026/5..." 
					class="w-full bg-gray-900/80 border-2 border-yellow-500/30 rounded-full px-6 py-3 text-white text-center 
							focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20 
							transition-all placeholder:text-gray-300 font-medium">		
					<p id="search" class="text-yellow-500/60 tracking-[0.4em] text-2xl font-bold mb-8 uppercase border-b">搜尋：輸入日期或經文章節</p>
			</div>
			
        </header>


        <div id="map-view" class="space-y-24">
            <section id="ot-section">
                <h2 class="text-2xl font-bold mb-8 tracking-[0.5em] text-yellow-500/60 uppercase border-b border-white/5 pb-4">舊約聖經</h2>
                <div id="ot-grid" class="grid grid-cols-5 md:grid-cols-10 lg:grid-cols-13 gap-3"></div>
            </section>
            <section id="nt-section">
                <h2 class="text-2xl font-bold mb-8 tracking-[0.5em] text-gray-500 uppercase border-b border-white/5 pb-4">新約聖經</h2>
                <div id="nt-grid" class="grid grid-cols-5 md:grid-cols-10 lg:grid-cols-13 gap-3"></div>
            </section>
        </div>

        <div id="gallery-view" class="hidden pb-20">
            <div id="note-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
        </div>

        <div id="loading-status" class="text-center py-20 text-gray-500 font-mono text-sm tracking-widest uppercase">Initializing...</div>
    </div>

    <div id="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</div>

    <script>
        const DB_URL = "database.json";
        let fullDatabase = [];
        let filteredNotes = [];
        let currentPage = 1;
        const itemsPerPage = 12;
		let sortOrder = { date: 'desc', chapter: 'asc' }; // 記錄各欄位的排序方向

        const bookFullName = {
            "創":"創世記","出":"出埃及記","利":"利未記","民":"民數記","申":"申命記","書":"約書亞記","士":"士師記","得":"路得記","撒上":"撒母耳記上","撒下":"撒母耳記下","王上":"列王紀上","王下":"列王紀下","代上":"歷代志上","代下":"歷代志下","拉":"以斯拉記","尼":"尼希米記","斯":"以斯帖記","伯":"約伯記","詩":"詩篇","箴":"箴言","傳":"傳道書","歌":"雅歌","賽":"以賽亞記","耶":"耶利米書","哀":"耶利米哀歌","結":"以西結書","但":"但以理書","何":"何西阿書","珥":"約珥書","摩":"阿摩司書","俄":"俄巴底亞書","拿":"約拿書","彌":"彌迦書","鴻":"那鴻書","哈":"哈巴谷書","番":"西番雅書","該":"哈該書","亞":"撒迦利亞書","瑪":"瑪拉基書",
            "太":"馬太福音","可":"馬可福音","路":"路加福音","約":"約翰福音","徒":"使徒行傳","羅":"羅馬書","林前":"哥林多前書","林後":"哥林多後書","加":"加拉太書","弗":"以弗所書","腓":"腓立比書","西":"歌羅西書","帖前":"帖撒羅尼迦前書","帖後":"帖撒羅尼迦後書","提前":"提摩太前書","提後":"提摩太後書","多":"提多書","門":"腓利門書","來":"希伯來書","雅":"雅各書","彼前":"彼得前書","彼後":"彼得後書","約一":"約翰一書","約二":"約翰二書","約三":"約翰三書","猶":"猶大書","啟":"啟示錄"
        };

        const otBooks = ["創", "出", "利", "民", "申", "書", "士", "得", "撒上", "撒下", "王上", "王下", "代上", "代下", "拉", "尼", "斯", "伯", "詩", "箴", "傳", "歌", "賽", "耶", "哀", "結", "但", "何", "珥", "摩", "俄", "拿", "彌", "鴻", "哈", "番", "該", "亞", "瑪"];
        const ntBooks = ["太", "可", "路", "約", "徒", "羅", "林前", "林後", "加", "弗", "腓", "西", "帖前", "帖後", "提前", "提後", "多", "門", "來", "雅", "彼前", "彼後", "約一", "約二", "約三", "猶", "啟"];

        
		
		async function init() {
            try {
                const res = await fetch(DB_URL + "?t=" + new Date().getTime());
                const data = await res.json();
                fullDatabase = data.files || data; 
                document.getElementById('loading-status').classList.add('hidden');
                renderMap();
				
				// 新增：監聽搜尋框 Enter 鍵
				document.getElementById('search-input').addEventListener('keypress', function (e) {
					if (e.key === 'Enter') {
						handleSearch();
					}
				});
            } catch (e) {
                document.getElementById('loading-status').innerText = "DATABASE ERROR.";
            }
        }

        function renderMap() {
            const otContainer = document.getElementById('ot-grid');
            const ntContainer = document.getElementById('nt-grid');
            const makeButtons = (books, container) => {
                books.forEach(b => {
                    const count = fullDatabase.filter(item => item.chapter.startsWith(b)).length;
                    const btn = document.createElement('div');
                    btn.className = `book-btn rounded-xl ${count === 0 ? 'disabled' : ''}`;
                    btn.innerText = b;
                    if (count > 0) {
                        btn.onclick = () => startShowBook(b);
                        btn.title = `${bookFullName[b] || b}: ${count} 篇筆記`;
                    }
                    container.appendChild(btn);
                });
            };
            makeButtons(otBooks, otContainer);
            makeButtons(ntBooks, ntContainer);
        }

        function startShowBook(abbr) {
            filteredNotes = fullDatabase.filter(item => item.chapter.startsWith(abbr));
			
			// 預設按日期降序排列
			//sortOrder.date = 'desc';
			//filteredNotes.sort((a, b) => (a.date > b.date ? -1 : 1));
            //currentPage = 1;
			
			// 進入時預設按「經文」升序排列 (1, 2, 3...)
            //sortOrder.chapter = 'asc';
			//filteredNotes.sort((a, b) => a.chapter.localeCompare(b.chapter, undefined, { numeric: true }));
			
			// 進入時預設按「經文」降序排列 (10, 9, 8...)
			sortOrder.chapter = 'desc';
			filteredNotes.sort((a, b) => b.chapter.localeCompare(a.chapter, undefined, { numeric: true }));
			currentPage = 1;
            
			
            document.getElementById('map-view').classList.add('hidden');
            document.getElementById('home-nav').classList.add('hidden');
            document.getElementById('gallery-view').classList.remove('hidden');
            document.getElementById('gallery-nav').classList.remove('hidden');
            
            // 🚀 修改置頂工具列文字為書卷縮寫 (例如：創)
            document.getElementById('toolbar-title').innerText = abbr;
            
            // 內容頁標題則維持全名
            document.getElementById('page-title').innerText = bookFullName[abbr] || abbr;
            document.getElementById('sub-title').innerText = "講章大綱";
            renderNotes();
        }

        function renderNotes() {
            const grid = document.getElementById('note-grid');
            grid.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredNotes.slice(start, end);

            pageItems.forEach(file => {
                let downloadSection = "";
                if (file.docId && file.docId !== "NoDoc" && file.docId.length > 10) {
                    downloadSection = `
                        <div class="flex gap-3 mt-6 pt-5 border-t border-white/10">
                            <a href="https://docs.google.com/document/d/${file.docId}/export?format=docx" class="btn-download bg-blue-600/20 text-blue-300">Word</a>
                            <a href="https://docs.google.com/document/d/${file.docId}/export?format=pdf" class="btn-download bg-red-600/20 text-red-300">PDF</a>
                        </div>`;
                }

                grid.innerHTML += `
                    <div class="glass-card rounded-3xl p-8 flex flex-col justify-between h-72">
                        <a href="${file.path}" class="block group">
                            <div class="flex justify-between items-center mb-6">
                                <span class="bg-yellow-500/20 text-[#f9d21b] text-sm px-4 py-1 rounded-full font-bold border border-yellow-500/30">${file.chapter}</span>
                                <span class="text-gray-400 text-sm font-mono">${file.date}</span>
                            </div>
                            <h2 class="text-3xl font-black leading-tight text-white/90 group-hover:text-[#f9d21b] transition-colors line-clamp-2">${file.title}</h2>
                        </a>
                        <div>${downloadSection}</div>
                    </div>`;
            });
            renderToolbarPagination();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

       function renderToolbarPagination() {
		const container = document.getElementById('toolbar-pagination');
		container.innerHTML = '';
		const totalPages = Math.ceil(filteredNotes.length / itemsPerPage);
		if (totalPages <= 1 && filteredNotes.length === 0) return;
	
		// --- 1. 新增排序按鈕組 ---
		const createSortBtn = (field, iconSvg, title) => {
        const btn = document.createElement('button');
        btn.className = 'nav-arrow-btn mr-2'; // 延用你之前的箭頭樣式
        btn.title = `${title}排序 (${sortOrder[field] === 'asc' ? '升序' : '降序'})`;
        btn.innerHTML = iconSvg;
        btn.onclick = () => handleSort(field);
        return btn;
		};

		// 日期圖示 (日曆)
		const dateIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
		// 經文圖示 (書卷)
		const chapterIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;

		container.appendChild(createSortBtn('date', dateIcon, '日期'));
		container.appendChild(createSortBtn('chapter', chapterIcon, '經文'));

		// 1. 上一頁按鈕 (左三角形)
		const prevBtn = document.createElement('button');
		prevBtn.innerHTML = '&#9664;'; // ◀
		prevBtn.className = 'nav-arrow-btn';
		prevBtn.disabled = (currentPage === 1);
		prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; renderNotes(); } };

		// 2. 下拉選單
		const select = document.createElement('select');
		select.className = 'page-select mx-2';
		for (let i = 1; i <= totalPages; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = i;
        if (i === currentPage) opt.selected = true;
        select.appendChild(opt);
		}
		select.onchange = (e) => {
        currentPage = parseInt(e.target.value); renderNotes(); };

		// 3. 下一頁按鈕 (右三角形)
		const nextBtn = document.createElement('button');
		nextBtn.innerHTML = '&#9654;'; // ▶
		nextBtn.className = 'nav-arrow-btn';
		nextBtn.disabled = (currentPage === totalPages || totalPages === 0);
		nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; renderNotes(); } };

		// 組合並放入容器
		container.appendChild(prevBtn);
		container.appendChild(select);
		container.appendChild(nextBtn);
}

        function showMap() {
            document.getElementById('map-view').classList.remove('hidden');
            document.getElementById('home-nav').classList.remove('hidden');
            document.getElementById('gallery-view').classList.add('hidden');
            document.getElementById('gallery-nav').classList.add('hidden');
            
            // 🚀 還原置頂工具列文字為 BIBLE MAP
            document.getElementById('toolbar-title').innerText = "BIBLE MAP";
            
            document.getElementById('page-title').innerText = "每日研經釋義";
            document.getElementById('sub-title').innerText = "講章大綱";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // 浮動按鈕顯示邏輯
        window.onscroll = function() {
            const btn = document.getElementById('scroll-to-top');
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        };

        init();
		
		function handleSort(field) {
			// 1. 切換排序方向
			sortOrder[field] = sortOrder[field] === 'asc' ? 'desc' : 'asc';

			filteredNotes.sort((a, b) => {
			// 2. 針對「經文(chapter)」進行自然排序處理
			if (field === 'chapter') {
            return sortOrder[field] === 'asc'
                ? a.chapter.localeCompare(b.chapter, undefined, { numeric: true, sensitivity: 'base' })
                : b.chapter.localeCompare(a.chapter, undefined, { numeric: true, sensitivity: 'base' });
			}

			// 3. 針對「日期」或其他欄位維持一般排序
			let valA = a[field];
			let valB = b[field];
			if (valA < valB) return sortOrder[field] === 'asc' ? -1 : 1;
			if (valA > valB) return sortOrder[field] === 'asc' ? 1 : -1;
			return 0;
			});

			// 4. 重置頁碼並重新渲染
			currentPage = 1;
			renderNotes();
		}
		
		// 搜尋處理函數
function handleSearch() {
    const input = document.getElementById('search-input').value.trim();
    if (!input) return;

    let searchResult = [];
    let titleText = `搜尋：${input}`;

    // --- 1. 強大日期解析 (支援 YYYY/M, YYYY/M/D, YYYY/M/D~D, 支援橫線或斜線) ---
    // 正則說明：年 [/-] 月 ([/-] 日 ([~-] 日終)?)?，且中間允許任意空白
    const dateMatch = input.match(/^(\d{4})[/-](\d{1,2})(?:\s*[/-]\s*(\d{1,2})(?:\s*[~-]\s*(\d{1,2}))?)?$/);

    if (dateMatch) {
        const year = dateMatch[1];
        const month = dateMatch[2].padStart(2, '0');
        const dayStart = dateMatch[3] ? dateMatch[3].padStart(2, '0') : null;
        const dayEnd = dateMatch[4] ? dateMatch[4].padStart(2, '0') : dayStart;

        if (!dayStart) {
            // 只有年月：2026/5 或 2026-05
            const prefix = `${year}-${month}`;
            searchResult = fullDatabase.filter(item => item.date.startsWith(prefix));
            titleText = `${year}年${month}月`;
        } else {
            // 有具體日期或範圍：2026/5/1 或 2026/5/1~3
            searchResult = fullDatabase.filter(item => {
                const itemDay = item.date.split('-')[2];
                return item.date.startsWith(`${year}-${month}`) && 
                       parseInt(itemDay) >= parseInt(dayStart) && 
                       parseInt(itemDay) <= parseInt(dayEnd);
            });
            titleText = dayStart === dayEnd ? `${year}/${month}/${dayStart}` : `${year}/${month}/${dayStart}~${dayEnd}`;
        }
    } 
    // --- 2. 經文範圍解析 (支援 創39, 出 1~3, 出1-3, 出 1 ~ 3 等各種空白與符號組合) ---
    else {
        // 正則說明：書卷名 + 選擇性空白 + 起始章節 + 選擇性(符號+結束章節)
        const scriptureMatch = input.match(/^([^\d\s]+)\s*(\d+)(?:\s*[~-]\s*(\d+))?$/);
        
        if (scriptureMatch) {
            const bookInput = scriptureMatch[1];
            const startChap = parseInt(scriptureMatch[2]);
            const endChap = scriptureMatch[3] ? parseInt(scriptureMatch[3]) : startChap;

            // 書卷名轉換邏輯
            let bookAbbr = bookInput;
            for (let abbr in bookFullName) {
                if (bookFullName[abbr] === bookInput) {
                    bookAbbr = abbr;
                    break;
                }
            }

            searchResult = fullDatabase.filter(item => {
                if (!item.chapter.startsWith(bookAbbr)) return false;
                // 只提取章數
                const chapterPart = item.chapter.substring(bookAbbr.length);
                const m = chapterPart.match(/^(\d+)/);
                if (!m) return false;
                const chapterNum = parseInt(m[1]);
                return chapterNum >= startChap && chapterNum <= endChap;
            });

            const fullName = bookFullName[bookAbbr] || bookAbbr;
            titleText = startChap === endChap ? `${fullName} 第${startChap}章` : `${fullName} ${startChap}~${endChap}章`;
        } else {
            // --- 3. 一般關鍵字搜尋 (標題或全文) ---
            searchResult = fullDatabase.filter(item => 
                item.title.includes(input) || item.chapter.includes(input)
            );
            titleText = `搜尋：${input}`;
        }
    }

    // 更新渲染狀態
    filteredNotes = searchResult;
    currentPage = 1;
    document.getElementById('page-title').innerText = titleText;
    
    // 切換視圖 (維持原有邏輯)
    document.getElementById('map-view').classList.add('hidden');
    document.getElementById('home-nav').classList.add('hidden');
    document.getElementById('gallery-view').classList.remove('hidden');
    document.getElementById('gallery-nav').classList.remove('hidden');
    document.getElementById('toolbar-title').innerText = "SEARCH";
    renderNotes();
}

    </script>
</body>
</html>
